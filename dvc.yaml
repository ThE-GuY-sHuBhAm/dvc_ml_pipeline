stages:
  data_ingestion:
    cmd: python ml-pipeline-imdb-movies-review/src/data/data_ingestion.py
    deps:
    - ml-pipeline-imdb-movies-review/src/data/data_ingestion.py
    params:
    - data_ingestion.test_size
    outs:
    - ml-pipeline-imdb-movies-review/data/raw
  data_preprocessing:
    cmd: python ml-pipeline-imdb-movies-review/src/data/data_preprocessing.py
    deps:
    - ml-pipeline-imdb-movies-review/data/raw
    - ml-pipeline-imdb-movies-review/src/data/data_preprocessing.py
    outs:
    - ml-pipeline-imdb-movies-review/data/interim
  feature_engineering:
    cmd: python 
      ml-pipeline-imdb-movies-review/src/features/feature_engineering.py
    deps:
    - ml-pipeline-imdb-movies-review/data/interim
    params:
    - feature_engineering.max_features
    - feature_engineering.ngram_range
    outs:
    - ml-pipeline-imdb-movies-review/data/processed
    - ml-pipeline-imdb-movies-review/models/vectorizer.pkl
  model_building:
    cmd: python ml-pipeline-imdb-movies-review/src/models/model_building.py
    deps:
    - ml-pipeline-imdb-movies-review/data/processed
    params:
    - model_building.n_estimators
    - model_building.learning_rate
    outs:
    - ml-pipeline-imdb-movies-review/models/model.pkl
  model_evaluation:
    cmd: python ml-pipeline-imdb-movies-review/src/models/model_evaluation.py
    deps:
    - ml-pipeline-imdb-movies-review/src/models
    - ml-pipeline-imdb-movies-review/data/processed
    outs:
    - ml-pipeline-imdb-movies-review/reports
  model_registration:
    cmd: python ml-pipeline-imdb-movies-review/src/models/register_model.py
    deps:
    - ml-pipeline-imdb-movies-review/reports/experiment_info.json
    - ml-pipeline-imdb-movies-review/src/models/register_model.py
  model_testing:
    cmd: python tests/test_model.py
    deps:
    - tests/test_model.py
    - ml-pipeline-imdb-movies-review/data/processed/test_tfidf.csv
    - ml-pipeline-imdb-movies-review/models/vectorizer.pkl


